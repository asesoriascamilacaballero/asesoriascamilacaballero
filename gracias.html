<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias | Camila Caballero</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #fdf2f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 32px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
        }
        .icon { font-size: 4rem; }
        h1 { margin: 16px 0 8px; color: #800020; }
        p { color: #6b7280; margin-bottom: 24px; }
        .btn-volver { background: #800020; color: white; padding: 12px 28px; border-radius: 60px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎉</div>
        <h1>¡Gracias por tu pago!</h1>
        <p>Recibirás un correo con la confirmación y los detalles de tu compra.</p>
        <a href="index.html" class="btn-volver">Volver al inicio</a>
    </div>
</body>
</html>
